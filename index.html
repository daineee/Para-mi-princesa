<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TE DETESTO TANTO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            font-family: 'Teko', sans-serif;
        }

        .contenedor-texto {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            transform: scaleY(1.3);
        }

        .linea {
            color: #800000;
            font-size: min(20vw, 40vh);
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            line-height: 0.85;
            letter-spacing: 2px;
            white-space: nowrap;
            user-select: none;
        }

        .boton-oculto {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 90px;
            height: 90px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 999;
            display: block;
        }
    </style>
</head>
<body>

    <div class="contenedor-texto">
        <div class="linea">TE DETESTO</div>
        <div class="linea">TANTO</div>
    </div>

    <a href="index1.html" class="boton-oculto" aria-label="Secreto"></a>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Carta</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #f4f1de;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .letter-container {
            width: 600px;
            height: 800px;
            background: #fff;
            border: 1px solid #ccc;
            padding: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-image: url('https://www.transparenttextures.com/patterns/rice-paper.png');
        }

        textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: 'Times New Roman', serif;
            font-size: 18px;
            line-height: 1.5;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="letter-container">
        <textarea placeholder="Hoy comienza la primavera, y no puedo evitar pensar en lo afortunado que soy de tenerte a mi lado. Al igual que las estaciones cambian, nuestro amor también crece y se renueva, trayendo cada día más alegria.
Eres la razón por la que mis días se llenan de colores y momentos inolvidables. Contigo, siento que cualquier cosa es posible, como si el mundo entero floreciera solo para nosotros.
Que esta primavera no solo marque el inicio de una nueva estación, sino también de más recuerdos hermosos, aventuras juntos y un amor que, como la naturaleza, siempre encuentra una manera de crecer y renovarse.
Recuerdo la primera vez que nos vimos, como si fuera ayer, y desde entonces no ha pasado un solo día en que no agradezca tenerte en mi vida. Hemos compartido tanto, y aún nos queda mucho por vivir. Cada paso que damos juntos me confirma que todo lo que hemos vivido nos ha hecho más fuertes, más unidos.
A veces pienso que eres mi mejor primavera, esa estación eterna donde todo florece, donde siempre hay un nuevo comienzo. Tu amor me llena de vida, me hace sentir completo, y no imagino una vida sin ti.
Quiero que sepas que siempre estaré aquí, en cada estación, en cada momento, para apoyarte, para amarte y para hacerte feliz. Que este amor que compartimos nunca deje de florecer, y que cada primavera que vivamos juntos nos recuerde lo afortunados que somos de tenernos el uno al otro.

Te amo más de lo que las palabras pueden expresar, y siempre, siempre lo haré.

dai💗" ></textarea>
    </div>

</body>
</html>
